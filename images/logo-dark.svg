<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="vb-primary-grad-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="vb-accent-grad-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="vb-shadow-d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(6, 4)">
    <path d="M28 2 L52 16 L52 44 L28 58 L4 44 L4 16 Z" 
          fill="url(#vb-primary-grad-d)" 
          filter="url(#vb-shadow-d)" />
          
    <path d="M28 7 L47 18 L47 42 L28 53 L9 42 L9 18 Z" 
          fill="#0B1329" opacity="0.4" />

    <circle cx="28" cy="30" r="16" stroke="url(#vb-accent-grad-d)" stroke-width="2.5" stroke-dasharray="4 3" />
    
    <path d="M19 21 L24 35 L28 24 L32 35 L37 21" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 17 L28 43" 
          stroke="url(#vb-accent-grad-d)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="28" cy="30" r="3" fill="#FFFFFF" />
    
    <circle cx="52" cy="16" r="3.5" fill="#34D399" />
  </g>

  <!-- Typography: VB PHARMA -->
  <text x="72" y="29" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="0.08em" fill="#FFFFFF">
    VB<tspan fill="#38BDF8">PHARMA</tspan>
  </text>

  <!-- Subtitle: ENGINEERING & MAINTENANCE -->
  <text x="73" y="46" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.22em" fill="#94A3B8">
    CƠ ĐIỆN &amp; VẬT TƯ KHO
  </text>

  <!-- Small Tag badge -->
  <rect x="236" y="14" width="76" height="18" rx="9" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  <text x="274" y="26.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" fill="#38BDF8" text-anchor="middle" letter-spacing="0.05em">
    VBTECH
  </text>
</svg>

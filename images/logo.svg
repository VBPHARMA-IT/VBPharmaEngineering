<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="vb-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="vb-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="vb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(6, 4)">
    <!-- Outer Hexagonal Tech Badge -->
    <path d="M28 2 L52 16 L52 44 L28 58 L4 44 L4 16 Z" 
          fill="url(#vb-primary-grad)" 
          filter="url(#vb-shadow)" />
          
    <!-- Inner Precision Shield with Medical/Pharma Cross + Gear Accents -->
    <path d="M28 7 L47 18 L47 42 L28 53 L9 42 L9 18 Z" 
          fill="#0F172A" opacity="0.18" />

    <!-- Gear Teeth Overlay around Core -->
    <circle cx="28" cy="30" r="16" stroke="url(#vb-accent-grad)" stroke-width="2.5" stroke-dasharray="4 3" />
    
    <!-- Stylized "VB" Monogram & Medical Cross -->
    <!-- The "V" and "B" Interlock with a Pharma Cross -->
    <path d="M19 21 L24 35 L28 24 L32 35 L37 21" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 17 L28 43" 
          stroke="url(#vb-accent-grad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="28" cy="30" r="3" fill="#FFFFFF" />
    
    <!-- Glowing Accent Dot -->
    <circle cx="52" cy="16" r="3.5" fill="#10B981" />
  </g>

  <!-- Typography: VB PHARMA -->
  <text x="72" y="29" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="0.08em" fill="#0F172A">
    VB<tspan fill="#0284C7">PHARMA</tspan>
  </text>

  <!-- Subtitle: ENGINEERING & MAINTENANCE -->
  <text x="73" y="46" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.22em" fill="#64748B">
    CƠ ĐIỆN &amp; VẬT TƯ KHO
  </text>

  <!-- Small Tag badge -->
  <rect x="236" y="14" width="76" height="18" rx="9" fill="#F1F5F9" />
  <text x="274" y="26.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" fill="#0284C7" text-anchor="middle" letter-spacing="0.05em">
    VBTECH
  </text>
</svg>
